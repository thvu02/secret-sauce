# Test Configuration for SplittyDupe
# This file is used during test execution

# Server Configuration
server.port=0

# JWT Configuration (test values)
jwt.secret=testSecretKeyForJWTAtLeast32CharactersLong123456789012345678901234567890
jwt.expiration=3600000

# Email Configuration (test values - not actually used in tests)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpassword
app.base-url=http://localhost:5173

# GCP Configuration (test values - mocked in tests)
GCP_PROJECT_ID=test-project
TRANSACTION_DATABASE_ID=test-database
TRANSACTION_COLLECTION=test-collection
PROCESSOR_ID=test-processor
PROCESSOR_LOCATION=us

# Logging Configuration
logging.level.org.splittydupe.startup=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Disable Actuator endpoints during tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Spring Security Test Configuration
spring.security.user.name=testuser
spring.security.user.password=testpassword
